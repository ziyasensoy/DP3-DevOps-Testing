name: CI

# Run the pipeline on every push and on every pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Fail if a package that ships in the app has a high or critical vulnerability.
      # Dev tools (jest, eslint) are left out because they don't end up in the image.
      - name: Check dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  test:
    # Only run the tests when lint has passed.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs unit and integration tests. Fails if coverage is below 80%.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  e2e:
    # Test the real page in a browser, after the unit and integration tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # Keep the report (with traces of failed tests) so we can see what went wrong.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    # Only build the image when all tests have passed.
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # Allow this job to push images to GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ziyasensoy/study-planner
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t study-planner .

      - name: Start the container
        run: docker run -d --name study-planner -p 3000:3000 study-planner

      # Check that the app inside the container actually answers.
      - name: Smoke test the health route
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs study-planner
          exit 1

      # Scan the image for known vulnerabilities. Fail on high or critical ones
      # that already have a fix, so we never push an image with a fixable problem.
      - name: Scan the image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            study-planner

      # Only publish the image for pushes to main, not for pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag the image with "latest" and with the commit id, then push both.
      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag study-planner $IMAGE:latest
          docker tag study-planner $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
