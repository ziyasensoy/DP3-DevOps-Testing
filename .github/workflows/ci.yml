name: CI/CD

# Run the pipeline on every push and on every pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow this job to push images to GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ziyasensoy/study-planner
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every job runs on a clean machine. Save node_modules and the Playwright
      # browser in a cache, so the next jobs can reuse them instead of installing again.
      # The key changes when package-lock.json changes, so the cache is never outdated.
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only install when there was no cache for this package-lock.json yet.
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install the Chromium browser
        if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build the Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t study-planner .

      - name: Start the container
        run: docker run -d --name study-planner -p 3000:3000 study-planner

      # Check that the app inside the container actually answers.
      - name: Smoke test the health route
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs study-planner
          exit 1

      # Scan the image for known vulnerabilities. Fail on high or critical ones
      # that already have a fix, so we never push an image with a fixable problem.
      - name: Scan the image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            study-planner

      # Only publish the image for pushes to main, not for pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the image tagged with the commit id, so the deploy jobs can use
      # exactly this version. It is only deployed after lint and tests pass.
      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag study-planner $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}

  lint:
    # Only lint after the build job has installed the dependencies.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse what the build job installed. Fail if it's missing,
      # so we notice it instead of silently running without packages.
      - name: Restore dependencies from the build job
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Run ESLint
        run: npm run lint

      # Fail if a package that ships in the app has a high or critical vulnerability.
      # Dev tools (jest, eslint) are left out because they don't end up in the image.
      - name: Check dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  test:
    # Run all tests in one place, after lint has passed:
    # first unit + integration tests, then the end-to-end tests in a browser.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse node_modules and the Chromium browser from the build job.
      - name: Restore dependencies from the build job
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      # Runs unit and integration tests. Fails if coverage is below 80%.
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      # The browser itself comes from the cache, but the system libraries
      # it needs are not part of the cache, so install those here.
      - name: Install system libraries for Chromium
        run: npx playwright install-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      # Keep the report (with traces of failed tests) so we can see what went wrong.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
