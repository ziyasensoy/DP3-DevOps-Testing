<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: 2fr 1.2fr 1fr 0.8fr auto; gap: 0.5rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    li.done .title { text-decoration: line-through; color: #888; }
    .title { flex: 1; }
    .urgency { width: 3ch; text-align: right; font-weight: bold; }
    .meta { color: #666; font-size: 0.85rem; }
    #error { color: #b00020; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Study Planner</h1>
  <p id="stats"></p>

  <form id="form">
    <input name="title" placeholder="What do you need to study?" maxlength="100" required>
    <input name="deadline" type="date">
    <select name="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <input name="estimatedHours" type="number" min="0.5" max="100" step="0.5" placeholder="Hours">
    <button>Add</button>
  </form>
  <p id="error"></p>

  <ul id="tasks"></ul>
</body>
</html>
