name: CI/CD

# Run the pipeline on every push and on every pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The image name is used by the build job and the deploy jobs.
env:
  IMAGE: ghcr.io/ziyasensoy/study-planner

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow this job to push images to GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every job runs on a clean machine. Save node_modules and the Playwright
      # browser in a cache, so the next jobs can reuse them instead of installing again.
      # The key changes when package-lock.json changes, so the cache is never outdated.
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only install when there was no cache for this package-lock.json yet.
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install the Chromium browser
        if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build the Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t study-planner .

      - name: Start the container
        run: docker run -d --name study-planner -p 3000:3000 study-planner

      # Check that the app inside the container actually answers.
      - name: Smoke test the health route
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs study-planner
          exit 1

      # Scan the image for known vulnerabilities. Fail on high or critical ones
      # that already have a fix, so we never push an image with a fixable problem.
      - name: Scan the image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            study-planner

      # Only publish the image for pushes to main, not for pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the image tagged with the commit id, so the deploy jobs can use
      # exactly this version. It is only deployed after lint and tests pass.
      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag study-planner $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}

  lint:
    # Only lint after the build job has installed the dependencies.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse what the build job installed. Fail if it's missing,
      # so we notice it instead of silently running without packages.
      - name: Restore dependencies from the build job
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Run ESLint
        run: npm run lint

      # Fail if a package that ships in the app has a high or critical vulnerability.
      # Dev tools (jest, eslint) are left out because they don't end up in the image.
      - name: Check dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  test:
    # Run all tests in one place, after lint has passed:
    # first unit + integration tests, then the end-to-end tests in a browser.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse node_modules and the Chromium browser from the build job.
      - name: Restore dependencies from the build job
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      # Runs unit and integration tests. Fails if coverage is below 80%.
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      # The browser itself comes from the cache, but the system libraries
      # it needs are not part of the cache, so install those here.
      - name: Install system libraries for Chromium
        run: npx playwright install-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      # Keep the report (with traces of failed tests) so we can see what went wrong.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  deploy-staging:
    # Only deploy pushes to main, and only after lint and all tests passed.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Uses the secret and URL from the "staging" environment in the GitHub settings.
    environment:
      name: staging
      url: ${{ vars.RENDER_URL }}
    steps:
      # Ask Render to deploy exactly the image that was built for this commit.
      - name: Deploy the image to Render
        run: curl -fsS -G "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE:${{ github.sha }}"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      # Wait until staging runs the new version. /health shows the commit id.
      # This can take a few minutes, because Render first has to start the new container.
      - name: Check that staging runs the new version
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -s "${{ vars.RENDER_URL }}/health" | jq -r '.commit' 2>/dev/null || true)
            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "Staging runs commit $commit"
              exit 0
            fi
            echo "Staging still runs '$commit', waiting..."
            sleep 10
          done
          echo "Staging did not get the new version within 10 minutes"
          exit 1

  deploy-production:
    # Only deploy to production after staging got the new version.
    needs: deploy-staging
    runs-on: ubuntu-latest
    # The "production" environment needs a manual approval in GitHub before this job starts.
    environment:
      name: production
      url: ${{ vars.RENDER_URL }}
    # Allow this job to add the "latest" tag in GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    # Share the version that ran before this deploy, so the rollback job knows what to go back to.
    outputs:
      previous: ${{ steps.previous.outputs.commit }}
    steps:
      # Remember which commit production runs now, before we change it.
      # Waits up to 2 minutes, because a sleeping Render service is slow to wake up.
      - name: Remember the current production version
        id: previous
        run: |
          commit=$(curl -s -m 120 "${{ vars.RENDER_URL }}/health" | jq -r '.commit' 2>/dev/null || true)
          echo "Production runs '$commit' before this deploy"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # Deploy exactly the same image that was tested on staging.
      - name: Deploy the image to Render
        run: curl -fsS -G "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE:${{ github.sha }}"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Check that production runs the new version
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -s "${{ vars.RENDER_URL }}/health" | jq -r '.commit' 2>/dev/null || true)
            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "Production runs commit $commit"
              exit 0
            fi
            echo "Production still runs '$commit', waiting..."
            sleep 10
          done
          echo "Production did not get the new version within 10 minutes"
          exit 1

      # Only for testing the rollback: a commit with "[simulate failure]" in its message
      # makes the deploy fail on purpose, so the rollback job takes over.
      - name: Simulate a failed deploy
        if: contains(github.event.head_commit.message, '[simulate failure]')
        run: |
          echo "Simulating a failed production deploy, the rollback job should take over"
          exit 1

      # The right version is running, but does the app really work?
      # Check the page and the API routes. If one fails, the rollback job takes over.
      - name: Smoke test production
        run: |
          for route in / /api/tasks /api/stats; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.RENDER_URL }}$route")
            echo "$route -> $code"
            if [ "$code" != "200" ]; then
              echo "Production is not working correctly"
              exit 1
            fi
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mark this version as "latest", so "latest" always means "what runs in production".
      - name: Tag the image as latest
        run: docker buildx imagetools create -t $IMAGE:latest $IMAGE:${{ github.sha }}

  rollback-production:
    # Only runs when the production deploy itself failed (not when an earlier job failed),
    # and only when we know which version ran before.
    needs: deploy-production
    if: failure() && needs.deploy-production.result == 'failure' && needs.deploy-production.outputs.previous != ''
    runs-on: ubuntu-latest
    # Separate environment without approval: a rollback should not wait for a person.
    environment:
      name: production-rollback
      url: ${{ vars.RENDER_URL }}
    env:
      PREVIOUS: ${{ needs.deploy-production.outputs.previous }}
    steps:
      # Only roll back to a real commit id, so we never deploy something unknown.
      - name: Check the previous version
        run: |
          if ! echo "$PREVIOUS" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "'$PREVIOUS' is not a commit id, so there is no safe version to go back to."
            exit 1
          fi
          echo "Rolling back production to $PREVIOUS"

      - name: Deploy the previous image to Render
        run: curl -fsS -G "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE:$PREVIOUS"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Check that production runs the previous version again
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -s "${{ vars.RENDER_URL }}/health" | jq -r '.commit' 2>/dev/null || true)
            if [ "$commit" = "$PREVIOUS" ]; then
              echo "Rollback done: production runs $commit again"
              exit 0
            fi
            echo "Production still runs '$commit', waiting..."
            sleep 10
          done
          echo "Rollback did not finish within 10 minutes"
          exit 1

      - name: Smoke test production after the rollback
        run: |
          for route in / /api/tasks /api/stats; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.RENDER_URL }}$route")
            echo "$route -> $code"
            if [ "$code" != "200" ]; then
              echo "Production still doesn't work after the rollback"
              exit 1
            fi
          done
