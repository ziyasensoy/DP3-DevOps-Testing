name: CI

# Run the pipeline on every push and on every pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    # Only run the tests when lint has passed.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs unit and integration tests. Fails if coverage is below 80%.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docker:
    # Only build the image when the tests have passed.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t study-planner .

      - name: Start the container
        run: docker run -d --name study-planner -p 3000:3000 study-planner

      # Check that the app inside the container actually answers.
      - name: Smoke test the health route
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs study-planner
          exit 1
