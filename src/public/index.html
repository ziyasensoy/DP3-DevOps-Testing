<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
</head>
<body>
  <h1>Study Planner</h1>
  <p id="stats"></p>

  <form id="form">
    <input name="title" placeholder="What do you need to study?" maxlength="100" required>
    <input name="deadline" type="date">
    <select name="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <input name="estimatedHours" type="number" min="0.5" max="100" step="0.5" placeholder="Hours">
    <button>Add</button>
  </form>
  <p id="error"></p>

  <ul id="tasks"></ul>
</body>
</html>
