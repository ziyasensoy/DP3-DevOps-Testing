<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: 2fr 1.2fr 1fr 0.8fr auto; gap: 0.5rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    li.done .title { text-decoration: line-through; color: #888; }
    .title { flex: 1; }
    .urgency { width: 3ch; text-align: right; font-weight: bold; }
    .meta { color: #666; font-size: 0.85rem; }
    #error { color: #b00020; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Study Planner</h1>
  <p id="stats"></p>

  <form id="form">
    <input name="title" placeholder="What do you need to study?" maxlength="100" required>
    <input name="deadline" type="date">
    <select name="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <input name="estimatedHours" type="number" min="0.5" max="100" step="0.5" placeholder="Hours">
    <button>Add</button>
  </form>
  <p id="error"></p>

  <ul id="tasks"></ul>

  <script>
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error((await res.json()).error);
      return res.status === 204 ? null : res.json();
    }

    function describeDays(days) {
      if (days === null) return 'no deadline';
      if (days < 0) return `${-days} day(s) overdue`;
      if (days === 0) return 'due today';
      return `${days} day(s) left`;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function render() {
      const [tasks, stats] = await Promise.all([api('GET', '/api/tasks'), api('GET', '/api/stats')]);
      document.getElementById('stats').textContent =
        `${stats.total} tasks · ${stats.done} done · ${stats.overdue} overdue · ${stats.hoursPlanned} h planned`;

      const items = tasks.map((t) => {
        const li = el('li', t.done ? 'done' : '');
        const done = el('input');
        done.type = 'checkbox';
        done.checked = t.done;
        done.onchange = () => api('PATCH', `/api/tasks/${t.id}`, { done: done.checked }).then(render);
        const remove = el('button', '', '✕');
        remove.onclick = () => api('DELETE', `/api/tasks/${t.id}`).then(render);
        li.append(
          done,
          el('span', 'urgency', t.urgency),
          el('span', 'title', t.title),
          el('span', 'meta', `${t.priority} · ${describeDays(t.daysLeft)}`),
          remove,
        );
        return li;
      });
      document.getElementById('tasks').replaceChildren(...items);
    }

    document.getElementById('form').onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const f = form.elements;
      const task = { title: f.title.value, priority: f.priority.value };
      // Treat the deadline as the end of that day in the user's own timezone.
      if (f.deadline.value) task.deadline = `${f.deadline.value}T23:59`;
      if (f.estimatedHours.value) task.estimatedHours = Number(f.estimatedHours.value);
      try {
        await api('POST', '/api/tasks', task);
        form.reset();
        document.getElementById('error').textContent = '';
        render();
      } catch (err) {
        document.getElementById('error').textContent = err.message;
      }
    };

    render();
  </script>
</body>
</html>
